<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fund the bounty pool · PatchPay</title>
  <style>
    :root { --accent: #2f6fed; --ink: #111; --muted: #5b6573; --line: #e3e8ef; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: var(--ink); }
    .sandbox { background: #fff4d6; padding: 8px 16px; text-align: center; font-size: 14px; }
    main { max-width: 520px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .balance { font-size: 36px; font-weight: 700; margin: 8px 0 0; }
    .amounts { display: flex; gap: 8px; margin: 20px 0; }
    .amounts button { flex: 1; min-height: 48px; border: 1px solid #cfd6e0; border-radius: 10px; background: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
    .amounts button[aria-pressed="true"] { border-color: var(--accent); background: #eef4ff; color: var(--accent); }
    .amounts button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #paypal { min-height: 50px; }
    .notice { border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
    .ok { background: #dcfae6; color: #067647; }
    .err { background: #fde2e1; color: #b42318; }
  </style>
</head>
<body>
  <div class="sandbox">SANDBOX · no real money moves</div>
  <main>
    <p><a href="/dev">← Dashboard</a></p>
    <h1>Fund the bug bounty pool</h1>
    <p class="muted">Players and fans can chip in. Every bounty is paid from this pool.</p>
    <p class="muted" style="margin:16px 0 0">Pool balance</p>
    <p class="balance" id="balance">—</p>
    <div class="amounts" role="group" aria-label="Amount">
      <button type="button" data-amount="5" aria-pressed="false">$5</button>
      <button type="button" data-amount="10" aria-pressed="false">$10</button>
      <button type="button" data-amount="20" aria-pressed="true">$20</button>
    </div>
    <div id="paypal"></div>
    <div id="msg" aria-live="polite"></div>
  </main>
  <script>
    let amount = 20;
    const msg = (text, cls) => { document.getElementById('msg').replaceChildren(Object.assign(document.createElement('div'), { className: `notice ${cls}`, textContent: text })); };
    const showBalance = (b) => { document.getElementById('balance').textContent = `$${Number(b).toFixed(2)}`; };

    for (const b of document.querySelectorAll('[data-amount]')) {
      b.onclick = () => {
        amount = Number(b.dataset.amount);
        document.querySelectorAll('[data-amount]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      };
    }

    async function main() {
      fetch('/api/pool').then((r) => r.json()).then((p) => showBalance(p.balance)).catch(() => {});
      const { paypalClientId } = await (await fetch('/api/config')).json();
      if (!paypalClientId) { msg('PayPal sandbox keys are not configured on this server yet.', 'err'); return; }
      const sdk = document.createElement('script');
      sdk.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(paypalClientId)}&currency=USD&intent=capture&components=buttons`;
      sdk.onerror = () => msg('Could not load PayPal. Check your connection and reload.', 'err');
      sdk.onload = () => paypal.Buttons({
        style: { layout: 'vertical', shape: 'rect', label: 'paypal' },
        createOrder: async () => {
          const r = await fetch('/api/pool/orders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ amount }) });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          return d.id;
        },
        onApprove: async ({ orderID }) => {
          const r = await fetch(`/api/pool/orders/${orderID}/capture`, { method: 'POST' });
          const d = await r.json();
          if (!r.ok) { msg(d.error, 'err'); return; }
          showBalance(d.pool.balance);
          msg(`Thanks! $${d.captured.toFixed(2)} added to the bounty pool.`, 'ok');
        },
        onCancel: () => msg('Payment cancelled. Nothing was charged.', 'err'),
        onError: (e) => msg(`PayPal error: ${e.message || 'please try again.'}`, 'err'),
      }).render('#paypal');
      document.head.append(sdk);
    }
    main();
  </script>
</body>
</html>
